 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Game</title>
    <link rel="stylesheet" href="Style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>
</head>

<body>
    <main>
        <div id="controler">
            <button id="Start"><i class="ri-play-fill"></i></button>
        </div>
        <div class="gameBoard">
            <div class="head">
                <div class="head-ele">
                    <h2 class="title">Hit</h2>
                    <div class="box">5</div>
                </div>
                <div class="head-ele">
                    <h2 class="title">Timer</h2>
                    <div class="box">5</div>
                </div>
                <div class="head-ele">
                    <h2 class="title">Score</h2>
                    <div class="box">5</div>
                </div>
            </div>
            <div class="bubble-board">
                <!-- <div class="bubble">5</div> -->
            </div>
        </div>
    </main>

    <script src="Script.js"></script>
</body>

</html>
