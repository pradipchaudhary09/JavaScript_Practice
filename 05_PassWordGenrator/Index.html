<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="container">
        <h1 class="password-display"></h1>
        <div class="settings">
            <div class="setting">
                <label for="password-length">Password length(1 to 10):</label>
                <input type="number" id="password-length" min="1" max="20">
            </div>
            <div class="setting">
                <label>
                    <input type="checkbox" id="include-uppercase" > Include uppercase letters:
                </label>
            </div>
            <div class="setting">
                <label>
                    <input type="checkbox" id="include-lowercase" > Include lowercase letters:
                </label>
            </div>
            <div class="setting">
                <label>
                    <input type="checkbox" id="include-numbers" > Include numbers:
                </label>
            </div>
            <div class="setting">
                <label>
                    <input type="checkbox" id="include-symbols" > Include symbols:
                </label>
            </div>
        </div>
        <button class="generate-button">Generate Password</button>
    </div>
    <script src="Script.js"></script>
</body>

</html>
